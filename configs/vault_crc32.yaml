target: "./targets/vulnerable_vault/vuln_vault"
input_mode: "stdin"
seed_dir: "seeds"
output_dir: "crashes"
reports_dir: "reports"
dict_path: "configs/dictionaries/common.dict"
checksum_mode: "crc32"
timeout: 1.5
max_iterations: 2000
workers: 2
use_forkserver: true
enable_sast_hints: true
sandbox: true
enable_namespaces: true
enable_seccomp: true
memory_mb: 256
monitor_logs: false
enable_triage: true
enable_coverage: true
auto_minimize: true
generate_report: true
